name: CI

# Plain, zero-token gates. Runs on GitHub's servers — no Claude usage.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # .claude/ is a local generated artifact (gitignored), so we can't drift-check it
      # in CI. Instead, prove the canonical agents/ + skills/ generate cleanly.
      - name: Agent/skill generation (canonical -> .claude/)
        run: python tools/sync_agents.py

      - name: Agent capability / security gate
        run: python tools/check_agent_security.py

      - name: Validate data fixtures (JSON / JSONL)
        run: python tools/validate_data.py

      - name: Python syntax compile
        run: python -m compileall -q tools

  # Smart-contract gate (TRD TR-9.2.2): the Escrow test suite must pass and the
  # source must be free of the forbidden Solidity anti-patterns (TR-8.6.1).
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Hardhat test suite
        run: npx hardhat test

      # Fails on any hit. `!` inverts grep: "no matches" (exit 1) becomes success.
      - name: Solidity anti-pattern grep
        run: |
          ! grep -rnE '_setupRole|SafeMath|tx\.origin|\.transfer\(|\.send\(|require\(msg\.sender ==' contracts/
